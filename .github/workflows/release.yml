name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync dpkg-dev libegl1 libgl1 libxkbcommon0 libfontconfig1
          python3 -m pip install --break-system-packages PySide6

      - name: Build .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${{ inputs.version }}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash packaging/build-deb.sh "$VERSION" amd64
          (cd dist && sha256sum *.deb > SHA256SUMS)

      - name: Logic tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_logic.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MyOmen v${{ env.VERSION }}
          make_latest: true
          files: |
            dist/*.deb
            dist/SHA256SUMS
            LICENSE
          body: |
            **MyOmen: free hardware control hub for HP OMEN 15-dh1xxx on Linux.**

            ### Install
            ```bash
            sudo apt install ./myomen_*_amd64.deb
            myomen
            ```
            Full fan/RGB control needs the patched `hp-wmi` driver; see `driver/INSTALL.md`.

            Freeware: free to use, all rights reserved. See LICENSE.
